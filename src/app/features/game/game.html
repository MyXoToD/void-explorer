<div
  class="game"
  [ngClass]="{ 'game--launched': launched() }"
  [style.background-color]="skyColor()"
>
  <div class="countdown">
    <span>3</span>
    <span>2</span>
    <span>1</span>
    <span>Lift off!</span>
  </div>
  <!-- <div class="rocket">
  <span></span>
    <span></span>
    <span></span>
  </div> -->
  <div class="rocket">
    <div class="rocket-body">
      <div class="body"></div>
      <div class="fin fin-left"></div>
      <div class="fin fin-right"></div>
      <div class="window"></div>
    </div>
    <div class="exhaust-flame"></div>
    <ul class="exhaust-fumes">
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>
  </div>
  <div class="ground"></div>

  <div class="stars" [style.opacity]="starsOpacity()">
    @for (star of stars; track star) {
      <div class="star" style="--x: {{ star.x }}; --y: {{ star.y }}; --d: {{ star.d }};"></div>
    }
  </div>

  <div class="fuel" [style.--fuel]="fuelPercent"></div>
</div>
